<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Green Gradient for Pill -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04b050" />
      <stop offset="50%" stop-color="#028a3c" />
      <stop offset="100%" stop-color="#015e28" />
    </linearGradient>
    
    <!-- Red Gradient for Main Hindi Title -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e60000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Blue Gradient for Main English Header -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112277" />
      <stop offset="100%" stop-color="#050e3c" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="240" fill="#ffffff" />

  <!-- Left Logo (Youth Revolutionary Emblem) -->
  <g transform="translate(20, 45)">
    <!-- Outer Ring -->
    <circle cx="65" cy="65" r="62" fill="none" stroke="#d63384" stroke-width="4" />
    <circle cx="65" cy="65" r="56" fill="none" stroke="#2b1055" stroke-width="2" />
    <circle cx="65" cy="65" r="42" fill="#2b1055" />
    <!-- Shield Icon Inside -->
    <path d="M 50,45 L 80,45 L 80,75 C 80,88 65,95 65,95 C 65,95 50,88 50,75 Z" fill="#ffffff" stroke="#e60000" stroke-width="2" />
    <!-- Text around ring -->
    <text x="65" y="18" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#d63384" text-anchor="middle">YOUTH REVOLUTIONARY</text>
    <text x="65" y="122" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#d63384" text-anchor="middle">NASRIGANJ</text>
    <text x="65" y="68" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#2b1055" text-anchor="middle">YR</text>
  </g>

  <!-- Right Logo (Nataraja / Golden Statue Emblem) -->
  <g transform="translate(755, 35)">
    <circle cx="65" cy="65" r="60" fill="none" stroke="#b37700" stroke-width="3" stroke-dasharray="6,3" />
    <ellipse cx="65" cy="65" rx="45" ry="55" fill="none" stroke="#d4af37" stroke-width="3" />
    <!-- Statue Silhouette -->
    <path d="M 65,25 C 68,25 70,27 70,30 C 70,33 68,35 65,35 C 62,35 60,33 60,30 C 60,27 62,25 65,25 Z M 55,45 L 75,45 L 70,75 L 85,90 L 75,95 L 65,80 L 55,95 L 45,90 L 60,75 Z" fill="#b37700" />
    <path d="M 40,55 Q 65,35 90,55 Q 65,75 40,55" fill="none" stroke="#d4af37" stroke-width="2" />
    <rect x="45" y="105" width="40" height="15" fill="#805500" rx="3" />
  </g>

  <!-- Main Center Titles -->
  <g text-anchor="middle">
    <!-- Top English Header: YOUTH REVOLUTIONARY -->
    <text x="450" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#blueGradient)" letter-spacing="4" stroke="#ffffff" stroke-width="1.5">
      YOUTH REVOLUTIONARY
    </text>

    <!-- Main Hindi Title: प्रतिभा खोज प्रतियोगिता -->
    <text x="450" y="125" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="44" font-weight="900" fill="url(#redGradient)" stroke="#800000" stroke-width="1.5" filter="url(#textShadow)">
      प्रतिभा खोज प्रतियोगिता
    </text>

    <!-- Subtitle: A Global Talent Search & Recognition Term -->
    <text x="450" y="158" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#112277" letter-spacing="1">
      A Global Talent Search &amp; Recognition Term
    </text>

    <!-- Green Pill Badge: नासरीगंज, चरणपुरी -->
    <g transform="translate(450, 175)">
      <!-- Pill Box Container -->
      <rect x="-160" y="0" width="320" height="38" rx="19" fill="url(#greenGradient)" stroke="#ffffff" stroke-width="2" filter="url(#textShadow)" />
      <!-- White Glow Border Highlight -->
      <rect x="-156" y="2" width="312" height="34" rx="17" fill="none" stroke="#80e699" stroke-width="1.5" opacity="0.6" />
      <!-- Text inside Pill -->
      <text x="0" y="25" font-family="'DejaVu Sans', 'Arial', sans-serif" font-size="21" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        नासरीगंज, चरणपुरी
      </text>
    </g>
  </g>
</svg>
