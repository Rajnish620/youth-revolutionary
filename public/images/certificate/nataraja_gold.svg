<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Sacred Flame Ring (Prabhamandala) -->
  <circle cx="100" cy="92" r="76" fill="none" stroke="#d97706" stroke-width="6" />
  <circle cx="100" cy="92" r="68" fill="none" stroke="#f59e0b" stroke-width="2" />

  <!-- Radiating Sacred Flames (Flame beads) around circumference -->
  <g fill="#d97706">
    <circle cx="100" cy="12" r="6" />
    <circle cx="127" cy="16" r="5.5" />
    <circle cx="152" cy="29" r="5.5" />
    <circle cx="170" cy="50" r="5.5" />
    <circle cx="180" cy="76" r="5.5" />
    <circle cx="178" cy="104" r="5.5" />
    <circle cx="166" cy="130" r="5.5" />
    <circle cx="145" cy="151" r="5.5" />
    <circle cx="120" cy="163" r="5.5" />
    <circle cx="80" cy="163" r="5.5" />
    <circle cx="55" cy="151" r="5.5" />
    <circle cx="34" cy="130" r="5.5" />
    <circle cx="22" cy="104" r="5.5" />
    <circle cx="20" cy="76" r="5.5" />
    <circle cx="30" cy="50" r="5.5" />
    <circle cx="48" cy="29" r="5.5" />
    <circle cx="73" cy="16" r="5.5" />
  </g>

  <!-- Nataraja (Cosmic Dance Figure) -->
  <g fill="#b45309" stroke="#b45309">
    <!-- Crown (Jatamukuta) -->
    <path d="M 94,36 L 106,36 L 103,48 L 97,48 Z" />
    <circle cx="100" cy="52" r="7" />

    <!-- Flowing Hair Locks -->
    <path d="M 94,52 Q 65,48 52,56" fill="none" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 106,52 Q 135,48 148,56" fill="none" stroke-width="3.5" stroke-linecap="round" />

    <!-- Torso -->
    <polygon points="93,60 107,60 104,88 96,88" />

    <!-- Upper Right Hand with Drum (Damaru) -->
    <path d="M 104,65 Q 128,58 138,46" fill="none" stroke-width="4.5" stroke-linecap="round" />
    <polygon points="135,40 143,40 139,48 146,48" />

    <!-- Upper Left Hand with Flame (Agni) -->
    <path d="M 96,65 Q 72,58 62,46" fill="none" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="60" cy="43" r="4.5" />

    <!-- Lower Right Hand (Abhaya Mudra) -->
    <path d="M 104,72 Q 120,76 125,84" fill="none" stroke-width="4" stroke-linecap="round" />

    <!-- Lower Left Hand (Gajahasta pointing to raised foot) -->
    <path d="M 96,72 Q 78,80 68,95" fill="none" stroke-width="4" stroke-linecap="round" />

    <!-- Standing Right Leg (Stambhapada) -->
    <path d="M 100,88 L 102,122 L 106,122" fill="none" stroke-width="6" stroke-linecap="round" />

    <!-- Lifted Left Leg (Kunchitapada in dynamic diagonal) -->
    <path d="M 97,88 Q 78,102 68,108 Q 62,110 56,108" fill="none" stroke-width="6" stroke-linecap="round" />

    <!-- Apasmara Dwarf -->
    <ellipse cx="102" cy="126" rx="16" ry="5.5" />

    <!-- Lotus Pedestal Base -->
    <polygon points="64,136 136,136 144,148 56,148" />
    <rect x="52" y="148" width="96" height="10" rx="2" />
    <rect x="44" y="158" width="112" height="12" rx="3" />
  </g>
</svg>
