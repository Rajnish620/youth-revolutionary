<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="rosetteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="rosetteCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef9c3" />
      <stop offset="75%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="ribbonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="ribbonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <!-- Hanging Ribbon Tails -->
  <polygon points="76,110 52,215 76,195 100,215 90,110" fill="url(#ribbonLeft)" />
  <polygon points="76,110 64,205 76,195 86,205 90,110" fill="#f59e0b" opacity="0.3" />

  <polygon points="110,110 100,215 124,195 148,215 124,110" fill="url(#ribbonRight)" />
  <polygon points="110,110 114,205 124,195 136,205 124,110" fill="#fde047" opacity="0.3" />

  <!-- Center Backing Shadow -->
  <circle cx="100" cy="85" r="62" fill="#92400e" opacity="0.25" />

  <!-- Outer Pleated Rosette (24 Sunburst Ribs) -->
  <g fill="url(#rosetteGold)" stroke="#d97706" stroke-width="1">
    <path d="
      M 100,20 L 108,24 L 119,22 L 126,29 L 138,30 L 143,39 L 154,43 L 157,53 L 166,60 L 166,71 L 172,80 L 169,91 L 172,101 L 166,111 L 165,121 L 156,129 L 151,139 L 140,144 L 133,153 L 122,154 L 113,161 L 102,159 L 93,164 L 83,159 L 75,161 L 67,154 L 57,153 L 51,144 L 40,139 L 36,129 L 28,121 L 28,111 L 22,101 L 25,91 L 21,80 L 27,71 L 27,60 L 37,53 L 40,43 L 51,39 L 56,30 L 68,29 L 75,22 L 86,24 Z
    " />
  </g>

  <!-- Secondary Inner Pleat Ring -->
  <circle cx="100" cy="85" r="50" fill="url(#rosetteGold)" stroke="#b45309" stroke-width="1.5" />

  <!-- Golden Stitched Ring -->
  <circle cx="100" cy="85" r="44" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="4,3" />

  <!-- Inner Polished Center Medallion -->
  <circle cx="100" cy="85" r="38" fill="url(#rosetteCenter)" stroke="#d97706" stroke-width="3" />
  <circle cx="100" cy="85" r="32" fill="none" stroke="#f59e0b" stroke-width="1.5" />

  <!-- Embossed Star in Center -->
  <polygon points="100,64 104,78 118,78 107,87 111,101 100,92 89,101 93,87 82,78 96,78" fill="#d97706" opacity="0.65" />
</svg>
